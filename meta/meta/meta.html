<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=6ee3d0c2-bf15-498b-9b75-7e9de0474555
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>METACRASH PREDICTOR</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="theme-color" content="#05060f">
    <link rel="stylesheet" href="../shared/predictor.css">
    <style>
        :root {
            --vh: 1vh;
            --cyan: #22d3ee;
            --violet: #a855f7;
            --blue: #3b82f6;
            --ink: #05060f;
            --txt: #e8eefc;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: calc(var(--vh) * 100);
            width: 100vw;
            background: var(--ink);
            color: var(--txt);
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* ============ FOND ANIMÉ : GRILLAGE CSS (droite -> gauche) ============ */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(120% 80% at 50% 0%, rgba(168, 85, 247, .28), transparent 60%),
                radial-gradient(100% 70% at 50% 100%, rgba(34, 211, 238, .20), transparent 62%),
                linear-gradient(180deg, #0a0b1f 0%, #05060f 45%, #070c1c 100%);
        }

        .bg-grid,
        .bg-grid2 {
            position: absolute;
            top: -20%;
            bottom: -20%;
            left: -60%;
            right: -60%;
            background-image:
                linear-gradient(to right, rgba(120, 190, 255, .16) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(120, 190, 255, .16) 1px, transparent 1px);
            background-size: 46px 46px;
            animation: gridslide 5s linear infinite;
            will-change: transform;
        }

        .bg-grid2 {
            background-image:
                linear-gradient(to right, rgba(168, 85, 247, .22) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(168, 85, 247, .22) 1px, transparent 1px);
            background-size: 184px 184px;
            animation-duration: 14s;
            opacity: .9;
        }

        @keyframes gridslide {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-46px);
            }
        }

        .bg-grid2 {
            animation-name: gridslide2;
        }

        @keyframes gridslide2 {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-184px);
            }
        }

        /* halo qui balaie le grillage de droite à gauche */
        .bg-sweep {
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, transparent 30%, rgba(34, 211, 238, .10) 48%, rgba(168, 85, 247, .12) 55%, transparent 72%);
            animation: sweep 9s linear infinite;
        }

        @keyframes sweep {
            from {
                transform: translateX(60%);
            }

            to {
                transform: translateX(-60%);
            }
        }

        /* vignette + fondu du grillage sur les bords */
        .bg-mask {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(80% 60% at 50% 45%, transparent 20%, rgba(5, 6, 15, .55) 75%, rgba(5, 6, 15, .92) 100%);
        }

        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        /* ====================== PAGE DE CHARGEMENT ====================== */
        .first-page {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 28px;
            padding: 24px;
            background: rgba(5, 6, 15, .35);
            transition: opacity .5s ease;
        }

        .first-page.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .center-image {
            width: min(62vw, 260px);
            max-height: 42vh;
            object-fit: contain;
            filter: drop-shadow(0 12px 40px rgba(34, 211, 238, .28));
        }

        .loader-container {
            width: min(78vw, 320px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .loader-bar-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, .10);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 50px;
            overflow: hidden;
        }

        .loader-bar-fill {
            height: 100%;
            width: 1%;
            border-radius: 50px;
            background: linear-gradient(90deg, var(--cyan), var(--blue), var(--violet));
            box-shadow: 0 0 14px rgba(59, 130, 246, .8);
            transition: width .06s linear;
        }

        .loader-pct {
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 3px;
            color: #fff;
        }

        .loader-label {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(232, 238, 252, .6);
        }

        /* ====================== PAGE PRINCIPALE ====================== */
        .app {
            display: none;
            flex-direction: column;
            height: 100vh;
            height: calc(var(--vh) * 100);
            width: 100%;
        }

        .app.active {
            display: flex;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 0;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #7dffb2;
            background: rgba(16, 185, 129, .12);
            border: 1px solid rgba(125, 255, 178, .35);
        }

        .live i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .25;
            }
        }

        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 8px 16px;
            min-height: 0;
        }

        .brand {
            width: min(34vw, 130px);
            height: auto;
            display: block;
            filter: drop-shadow(0 6px 22px rgba(168, 85, 247, .40));
        }

        /* ====================== NOUVEAU CERCLE ====================== */
        .orb {
            position: relative;
            width: min(62vw, 240px);
            height: min(62vw, 240px);
            display: grid;
            place-items: center;
            flex: 0 0 auto;
        }

        .orb-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0 12%, var(--cyan) 32%, var(--violet) 58%, transparent 78% 100%);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
            animation: spin 3.6s linear infinite;
            filter: drop-shadow(0 0 12px rgba(34, 211, 238, .55));
        }

        .orb-dash {
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            border: 2px dashed rgba(168, 85, 247, .45);
            animation: spin 12s linear infinite reverse;
        }

        .orb-halo {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .10);
            animation: halo 2.6s ease-in-out infinite;
        }

        @keyframes halo {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(34, 211, 238, .35);
            }

            60% {
                box-shadow: 0 0 0 16px rgba(34, 211, 238, 0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .orb-core {
            position: absolute;
            inset: 26px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            background:
                radial-gradient(90% 90% at 50% 20%, rgba(59, 130, 246, .18), transparent 70%),
                rgba(6, 8, 20, .92);
            border: 1px solid rgba(255, 255, 255, .08);
            box-shadow: inset 0 0 40px rgba(34, 211, 238, .12);
        }

        .signal-label {
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 900;
            color: #ffd54a;
        }

        #coefficient-circle {
            font-size: clamp(26px, 9vw, 40px);
            font-weight: 900;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 22px rgba(34, 211, 238, .55);
        }

        #coefficient-circle.idle {
            font-size: clamp(13px, 4vw, 16px);
            color: rgba(232, 238, 252, .55);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .orb.pending .orb-ring {
            animation-duration: .8s;
        }

        /* chip heure de jeu */
        .time-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 50px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .12);
            backdrop-filter: blur(8px);
            font-size: 12px;
            letter-spacing: 1.5px;
            font-weight: 800;
            color: rgba(232, 238, 252, .7);
        }

        .time-chip b {
            font-size: 17px;
            letter-spacing: 1px;
            color: var(--cyan);
            font-variant-numeric: tabular-nums;
        }

        .time-chip.on {
            border-color: rgba(34, 211, 238, .45);
            box-shadow: 0 0 22px rgba(34, 211, 238, .18);
        }

        /* ====================== BAS DE PAGE ====================== */
        .footer {
            padding: 0 16px calc(16px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn {
            position: relative;
            width: 100%;
            max-width: 420px;
            border: 0;
            cursor: pointer;
            font-family: inherit;
            border-radius: 16px;
            padding: 17px 20px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #fff;
            overflow: hidden;
            background: linear-gradient(135deg, #7c3aed 0%, #2563eb 55%, #06b6d4 100%);
            box-shadow: 0 12px 30px rgba(124, 58, 237, .35), inset 0 1px 0 rgba(255, 255, 255, .28);
            transition: transform .14s ease, box-shadow .25s ease, filter .25s ease;
        }

        .btn span {
            position: relative;
            z-index: 2;
        }

        .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 25%, rgba(255, 255, 255, .35) 50%, transparent 75%);
            transform: translateX(-130%);
            animation: sheen 3.2s ease-in-out infinite;
        }

        @keyframes sheen {

            0%,
            65% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(130%);
            }
        }

        .btn:active {
            transform: translateY(2px) scale(.995);
            box-shadow: 0 6px 18px rgba(124, 58, 237, .3);
        }

        .btn[disabled] {
            cursor: not-allowed;
            filter: grayscale(.45) brightness(.7);
            box-shadow: none;
        }

        .btn[disabled]::after {
            display: none;
        }

        .btn-cool {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 4px;
            width: 0%;
            background: linear-gradient(90deg, var(--cyan), var(--violet));
            z-index: 3;
            transition: width .3s linear;
        }

        .btn-ghost {
            width: auto;
            padding: 9px 15px;
            font-size: 11px;
            letter-spacing: 1.5px;
            border-radius: 50px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .16);
            box-shadow: none;
            backdrop-filter: blur(8px);
            color: rgba(232, 238, 252, .85);
        }

        .btn-ghost::after {
            display: none;
        }

        .hint {
            font-size: 10.5px;
            letter-spacing: 1.5px;
            color: rgba(232, 238, 252, .42);
            text-align: center;
        }

        /* ====================== TOAST ====================== */
        .message-table {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translate(-50%, -140%);
            max-width: 90vw;
            padding: 12px 20px;
            border-radius: 0 0 16px 16px;
            background: rgba(10, 12, 28, .92);
            border: 1px solid rgba(255, 255, 255, .12);
            border-top: 0;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
            text-align: center;
            transition: transform .45s cubic-bezier(.2, .9, .3, 1.3);
            z-index: 1000;
        }

        .message-table.active {
            transform: translate(-50%, 0);
        }

        @media (max-height: 640px) {
            .brand {
                width: min(26vw, 96px);
            }

            .orb {
                width: min(50vw, 190px);
                height: min(50vw, 190px);
            }
        }
    </style>
</head>

<body>
    <!-- Fond animé 100% CSS -->
    <div class="bg"></div>
    <div class="bg-wrap">
        <div class="bg-grid"></div>
        <div class="bg-grid2"></div>
        <div class="bg-sweep"></div>
        <div class="bg-mask"></div>
    </div>

    <div class="first-page" id="first-page">
        <img src="img/meta.png" alt="Meta Crash" class="center-image">
        <div class="loader-container">
            <div class="loader-label">LOADING PREDICTOR...</div>
            <div class="loader-bar-track">
                <div class="loader-bar-fill" id="loader-bar-fill"></div>
            </div>
            <div class="loader-pct" id="loader-pct">1%</div>
        </div>
    </div>

    <div class="app" id="lucky-jet-page">
        <div class="message-table" id="message-table"><span id="message-text"></span></div>

        <div class="topbar">
            <button class="btn btn-ghost" onclick="closePage()"><span>← Back</span></button>
            <span class="live"><i></i>LIVE</span>
        </div>

        <div class="stage">
            <img class="brand" src="img/meta.png" alt="Meta Crash">

            <div class="orb" id="orb">
                <div class="orb-halo"></div>
                <div class="orb-ring"></div>
                <div class="orb-dash"></div>
                <div class="orb-core">
                    <span class="signal-label">NEXT COEFFICIENT ✅</span>
                    <span id="coefficient-circle" class="idle">EN ATTENTE</span>
                </div>
            </div>

            <div class="time-chip" id="time-chip">🕒 HEURE DE JEU <b id="play-time">--:--:--</b></div>
        </div>

        <div class="footer">
            <button class="btn" id="predict-btn" type="button">
                <span id="predict-label">NOUVELLE PRÉDICTION</span>
                <i class="btn-cool" id="btn-cool"></i>
            </button>
            <div class="hint" id="hint">APPUYEZ POUR OBTENIR VOTRE SIGNAL</div>
        </div>
    </div>

    <script src="../shared/protect.js"></script>
    <script src="../shared/predictor.js"></script>
    <script src="js/meta.js"></script>

</body>

</html>
