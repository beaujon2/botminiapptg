<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=6ee3d0c2-bf15-498b-9b75-7e9de0474555
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>AVIATOR PREDICTOR</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="theme-color" content="#050506">
    <link rel="stylesheet" href="../shared/predictor.css">
    <style>
        :root {
            --vh: 1vh;
            --red: #e50539;
            --red2: #ff3b5c;
            --gold: #ffb020;
            --ink: #050506;
            --txt: #f2f3f7;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: calc(var(--vh) * 100);
            width: 100vw;
            background: var(--ink);
            color: var(--txt);
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* ============ FOND AVIATOR : RAYONS CSS QUI TOURNENT ============ */
        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
            background: #030304;
        }

        /* éventail centré sur le coin bas-gauche, comme dans le vrai Aviator */
        .rays {
            position: absolute;
            width: 300vmax;
            height: 300vmax;
            left: -150vmax;
            bottom: -150vmax;
            background: repeating-conic-gradient(from 0deg,
                    #17171b 0deg 5.4deg,
                    #060607 5.4deg 11deg);
            animation: rayspin 70s linear infinite;
            will-change: transform;
        }

        /* deuxième éventail plus fin et plus lent = profondeur */
        .rays2 {
            position: absolute;
            width: 300vmax;
            height: 300vmax;
            left: -150vmax;
            bottom: -150vmax;
            background: repeating-conic-gradient(from 2deg,
                    rgba(229, 5, 57, .055) 0deg 2.2deg,
                    transparent 2.2deg 9deg);
            animation: rayspin 130s linear infinite;
            will-change: transform;
        }

        @keyframes rayspin {
            to {
                transform: rotate(360deg);
            }
        }

        /* halo rouge au coin bas-gauche (le point de départ de l'avion) */
        .bg-glow {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(60% 45% at 0% 100%, rgba(229, 5, 57, .30), transparent 65%),
                radial-gradient(70% 50% at 50% 0%, rgba(229, 5, 57, .10), transparent 70%);
        }

        .bg-mask {
            position: absolute;
            inset: 0;
            background: radial-gradient(85% 65% at 50% 45%, transparent 25%, rgba(3, 3, 4, .55) 78%, rgba(3, 3, 4, .93) 100%);
        }

        /* ====================== PAGE DE CHARGEMENT ====================== */
        .first-page {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 24px;
            background: rgba(3, 3, 4, .35);
            transition: opacity .5s ease;
        }

        .first-page.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .center-image {
            width: min(64vw, 250px);
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 34px rgba(229, 5, 57, .55));
        }

        .loader-container {
            width: min(78vw, 320px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .loader-bar-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, .10);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 50px;
            overflow: hidden;
        }

        .loader-bar-fill {
            height: 100%;
            width: 1%;
            border-radius: 50px;
            background: linear-gradient(90deg, var(--gold), var(--red2), var(--red));
            box-shadow: 0 0 14px rgba(229, 5, 57, .8);
            transition: width .06s linear;
        }

        .loader-pct {
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 3px;
            color: #fff;
        }

        .loader-label {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(242, 243, 247, .6);
        }

        /* ====================== PAGE PRINCIPALE ====================== */
        .app {
            display: none;
            flex-direction: column;
            height: 100vh;
            height: calc(var(--vh) * 100);
            width: 100%;
        }

        .app.active {
            display: flex;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 0;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #7dffb2;
            background: rgba(16, 185, 129, .12);
            border: 1px solid rgba(125, 255, 178, .35);
        }

        .live i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .25;
            }
        }

        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 8px 16px;
            min-height: 0;
        }

        .brand {
            width: min(40vw, 150px);
            height: auto;
            display: block;
            filter: drop-shadow(0 6px 20px rgba(229, 5, 57, .55));
        }

        /* ====================== LE CERCLE ====================== */
        .orb {
            position: relative;
            width: min(62vw, 240px);
            height: min(62vw, 240px);
            display: grid;
            place-items: center;
            flex: 0 0 auto;
        }

        .orb-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0 12%, var(--gold) 30%, var(--red) 58%, transparent 78% 100%);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
            animation: spin 3.6s linear infinite;
            filter: drop-shadow(0 0 12px rgba(229, 5, 57, .6));
        }

        .orb-dash {
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 176, 32, .35);
            animation: spin 12s linear infinite reverse;
        }

        .orb-halo {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .10);
            animation: halo 2.6s ease-in-out infinite;
        }

        @keyframes halo {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(229, 5, 57, .40);
            }

            60% {
                box-shadow: 0 0 0 16px rgba(229, 5, 57, 0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .orb-core {
            position: absolute;
            inset: 26px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            background:
                radial-gradient(90% 90% at 50% 20%, rgba(229, 5, 57, .20), transparent 70%),
                rgba(8, 6, 10, .92);
            border: 1px solid rgba(255, 255, 255, .08);
            box-shadow: inset 0 0 40px rgba(229, 5, 57, .14);
        }

        .signal-label {
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 900;
            color: var(--gold);
        }

        #coefficient {
            font-size: clamp(28px, 10vw, 44px);
            font-weight: 900;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 22px rgba(229, 5, 57, .7);
        }

        #coefficient.idle {
            font-size: clamp(13px, 4vw, 16px);
            color: rgba(242, 243, 247, .55);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .orb.pending .orb-ring {
            animation-duration: .8s;
        }

        /* puces info */
        .chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 50px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .12);
            backdrop-filter: blur(8px);
            font-size: 11px;
            letter-spacing: 1.4px;
            font-weight: 800;
            color: rgba(242, 243, 247, .65);
        }

        .chip b {
            font-size: 16px;
            letter-spacing: 1px;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .chip.on {
            border-color: rgba(229, 5, 57, .5);
            box-shadow: 0 0 20px rgba(229, 5, 57, .18);
        }

        .chip.on b {
            color: var(--red2);
        }

        .chip.chance.on b {
            color: #4ade80;
        }

        .status {
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 800;
            color: rgba(242, 243, 247, .5);
            text-align: center;
            min-height: 14px;
        }

        .status.ok {
            color: #4ade80;
        }

        .status.run {
            color: var(--gold);
            animation: blink 1.2s ease-in-out infinite;
        }

        /* ====================== BAS DE PAGE ====================== */
        .footer {
            padding: 0 16px calc(16px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn {
            position: relative;
            width: 100%;
            max-width: 420px;
            border: 0;
            cursor: pointer;
            font-family: inherit;
            border-radius: 16px;
            padding: 17px 20px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #fff;
            overflow: hidden;
            background: linear-gradient(135deg, #ff6a00 0%, var(--red) 55%, #a3002a 100%);
            box-shadow: 0 12px 30px rgba(229, 5, 57, .40), inset 0 1px 0 rgba(255, 255, 255, .28);
            transition: transform .14s ease, box-shadow .25s ease, filter .25s ease;
        }

        .btn span {
            position: relative;
            z-index: 2;
        }

        .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 25%, rgba(255, 255, 255, .35) 50%, transparent 75%);
            transform: translateX(-130%);
            animation: sheen 3.2s ease-in-out infinite;
        }

        @keyframes sheen {

            0%,
            65% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(130%);
            }
        }

        .btn:active {
            transform: translateY(2px) scale(.995);
            box-shadow: 0 6px 18px rgba(229, 5, 57, .3);
        }

        .btn[disabled] {
            cursor: not-allowed;
            filter: grayscale(.45) brightness(.7);
            box-shadow: none;
        }

        .btn[disabled]::after {
            display: none;
        }

        .btn-cool {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 4px;
            width: 0%;
            background: linear-gradient(90deg, var(--gold), var(--red2));
            z-index: 3;
            transition: width .3s linear;
        }

        .btn-ghost {
            width: auto;
            padding: 9px 15px;
            font-size: 11px;
            letter-spacing: 1.5px;
            border-radius: 50px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .16);
            box-shadow: none;
            backdrop-filter: blur(8px);
            color: rgba(242, 243, 247, .85);
        }

        .btn-ghost::after {
            display: none;
        }

        .hint {
            font-size: 10.5px;
            letter-spacing: 1.5px;
            color: rgba(242, 243, 247, .42);
            text-align: center;
        }

        /* ====================== TOAST ====================== */
        .message-table {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translate(-50%, -140%);
            max-width: 90vw;
            padding: 12px 20px;
            border-radius: 0 0 16px 16px;
            background: rgba(14, 8, 12, .94);
            border: 1px solid rgba(255, 255, 255, .12);
            border-top: 0;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
            text-align: center;
            transition: transform .45s cubic-bezier(.2, .9, .3, 1.3);
            z-index: 1000;
        }

        .message-table.active {
            transform: translate(-50%, 0);
        }

        @media (max-height: 640px) {
            .brand {
                width: min(30vw, 110px);
            }

            .orb {
                width: min(50vw, 190px);
                height: min(50vw, 190px);
            }
        }
    </style>
</head>

<body>
    <!-- Fond Aviator 100% CSS -->
    <div class="bg-wrap">
        <div class="rays"></div>
        <div class="rays2"></div>
        <div class="bg-glow"></div>
        <div class="bg-mask"></div>
    </div>

    <div class="first-page" id="first-page">
        <img src="img/aviator-logo.png" alt="Aviator" class="center-image">
        <div class="loader-container">
            <div class="loader-label">LOADING PREDICTOR...</div>
            <div class="loader-bar-track">
                <div class="loader-bar-fill" id="loader-bar-fill"></div>
            </div>
            <div class="loader-pct" id="loader-pct">1%</div>
        </div>
    </div>

    <div class="app" id="app">
        <div class="message-table" id="message-table"><span id="message-text"></span></div>

        <div class="topbar">
            <button class="btn btn-ghost" onclick="closePage()"><span>← Back</span></button>
            <span class="live"><i></i>LIVE</span>
        </div>

        <div class="stage">
            <img class="brand" src="img/aviator-logo.png" alt="Aviator">

            <div class="orb" id="orb">
                <div class="orb-halo"></div>
                <div class="orb-ring"></div>
                <div class="orb-dash"></div>
                <div class="orb-core">
                    <span class="signal-label">NEXT COEFFICIENT ✅</span>
                    <span id="coefficient" class="idle">EN ATTENTE</span>
                </div>
            </div>

            <div class="chips">
                <div class="chip" id="chip-time">🕒 HEURE <b id="play-time">--:--</b></div>
                <div class="chip chance" id="chip-chance">🎯 CHANCE <b id="chance">--%</b></div>
            </div>

            <div class="status" id="status">EN ATTENTE DE VOTRE DEMANDE</div>
        </div>

        <div class="footer">
            <button class="btn" id="signal-btn" type="button">
                <span id="signal-label">NOUVELLE PRÉDICTION</span>
                <i class="btn-cool" id="btn-cool"></i>
            </button>
            <div class="hint" id="hint">APPUYEZ POUR OBTENIR VOTRE SIGNAL</div>
        </div>
    </div>

    <script src="../shared/protect.js"></script>
    <script src="../shared/predictor.js"></script>
    <script src="js/aviator.js"></script>

</body>

</html>
