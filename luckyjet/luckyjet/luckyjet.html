<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site

     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>LUCKY JET PREDICTOR</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <meta name="theme-color" content="#150c2e">
    <link rel="stylesheet" href="../shared/predictor.css">
    <style>
        :root {
            --vh: 1vh;
            --violet: #a855f7;
            --magenta: #e0399b;
            --orange: #ff8a1f;
            --ink: #150c2e;
            --txt: #f3eefc;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: calc(var(--vh) * 100);
            width: 100vw;
            background: var(--ink);
            color: var(--txt);
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* ============ CIEL LUCKY JET (100% CSS) ============ */
        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .sky {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(70% 45% at 15% 100%, rgba(255, 138, 31, .30), transparent 62%),
                radial-gradient(80% 50% at 80% 12%, rgba(224, 57, 155, .28), transparent 65%),
                linear-gradient(180deg, #120a26 0%, #2a1150 38%, #5a1c62 72%, #7a2450 100%);
        }

        /* étoiles : 2 tuiles de points qui dérivent lentement */
        .stars {
            position: absolute;
            top: -10%;
            bottom: -10%;
            left: -50%;
            right: -50%;
            background-image:
                radial-gradient(1.6px 1.6px at 20px 30px, rgba(255, 255, 255, .85), transparent),
                radial-gradient(1.4px 1.4px at 110px 80px, rgba(255, 255, 255, .55), transparent),
                radial-gradient(1.8px 1.8px at 170px 20px, rgba(255, 235, 200, .75), transparent),
                radial-gradient(1.2px 1.2px at 60px 150px, rgba(255, 255, 255, .45), transparent),
                radial-gradient(1.5px 1.5px at 210px 130px, rgba(255, 255, 255, .65), transparent);
            background-size: 260px 190px;
            animation: starDrift 90s linear infinite, twinkle 4s ease-in-out infinite;
            opacity: .8;
        }

        @keyframes starDrift {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-260px);
            }
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: .8;
            }

            50% {
                opacity: .45;
            }
        }

        /* nuages : formes CSS qui défilent de droite vers la gauche */
        .cloud {
            position: absolute;
            border-radius: 999px;
            background: linear-gradient(180deg, #6d5aa8 0%, #3b2a68 100%);
            animation-name: drift;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            will-change: transform;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: inherit;
        }

        .cloud::before {
            width: 58%;
            height: 145%;
            left: 10%;
            bottom: 32%;
        }

        .cloud::after {
            width: 42%;
            height: 118%;
            right: 12%;
            bottom: 28%;
        }

        @keyframes drift {
            from {
                transform: translateX(108vw);
            }

            to {
                transform: translateX(-70vw);
            }
        }

        /* couche lointaine : petits, pâles, lents */
        .c1 {
            width: 130px;
            height: 34px;
            bottom: 58%;
            opacity: .28;
            animation-duration: 46s;
            animation-delay: -6s;
        }

        .c2 {
            width: 96px;
            height: 26px;
            bottom: 71%;
            opacity: .22;
            animation-duration: 58s;
            animation-delay: -30s;
        }

        .c3 {
            width: 150px;
            height: 38px;
            bottom: 44%;
            opacity: .25;
            animation-duration: 52s;
            animation-delay: -18s;
        }

        /* couche proche : gros, opaques, rapides */
        .c4 {
            width: 230px;
            height: 60px;
            bottom: 6%;
            opacity: .55;
            animation-duration: 26s;
            animation-delay: -4s;
        }

        .c5 {
            width: 300px;
            height: 76px;
            bottom: -2%;
            opacity: .62;
            animation-duration: 20s;
            animation-delay: -13s;
        }

        .c6 {
            width: 190px;
            height: 50px;
            bottom: 20%;
            opacity: .40;
            animation-duration: 34s;
            animation-delay: -22s;
        }

        .bg-mask {
            position: absolute;
            inset: 0;
            background: radial-gradient(85% 62% at 50% 45%, transparent 22%, rgba(18, 10, 38, .55) 76%, rgba(18, 10, 38, .90) 100%);
        }

        /* ====================== PAGE DE CHARGEMENT ====================== */
        .first-page {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 28px;
            padding: 24px;
            background: rgba(18, 10, 38, .35);
            transition: opacity .5s ease;
        }

        .first-page.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ====== LOGO TEXTE : LUCKY violet + JET blanc ====== */
        .wordmark {
            display: flex;
            align-items: baseline;
            gap: .3em;
            white-space: nowrap;
            font-family: "Arial Black", "Segoe UI", Impact, sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -.5px;
            line-height: 1;
        }

        .wordmark .w1 {
            color: #984cf7;
            text-shadow: 0 0 26px rgba(152, 76, 247, .65);
        }

        .wordmark .w2 {
            color: #fff;
            text-shadow: 0 0 26px rgba(255, 255, 255, .45);
        }

        .wordmark.big {
            font-size: clamp(34px, 12vw, 58px);
        }

        .wordmark.small {
            font-size: clamp(24px, 8vw, 38px);
            animation: float 4s ease-in-out infinite;
        }

        .loader-container {
            width: min(78vw, 320px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .loader-bar-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, .10);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 50px;
            overflow: hidden;
        }

        .loader-bar-fill {
            height: 100%;
            width: 1%;
            border-radius: 50px;
            background: linear-gradient(90deg, var(--orange), var(--magenta), var(--violet));
            box-shadow: 0 0 14px rgba(224, 57, 155, .8);
            transition: width .06s linear;
        }

        .loader-pct {
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 3px;
            color: #fff;
        }

        .loader-label {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(243, 238, 252, .6);
        }

        /* ====================== PAGE PRINCIPALE ====================== */
        .app {
            display: none;
            flex-direction: column;
            height: 100vh;
            height: calc(var(--vh) * 100);
            width: 100%;
        }

        .app.active {
            display: flex;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 0;
        }

        .live {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #7dffb2;
            background: rgba(16, 185, 129, .12);
            border: 1px solid rgba(125, 255, 178, .35);
        }

        .live i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .25;
            }
        }

        .stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 8px 16px;
            min-height: 0;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* ====================== LE CERCLE ====================== */
        .orb {
            position: relative;
            width: min(62vw, 240px);
            height: min(62vw, 240px);
            display: grid;
            place-items: center;
            flex: 0 0 auto;
        }

        .orb-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0 12%, var(--orange) 30%, var(--magenta) 56%, var(--violet) 70%, transparent 82% 100%);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 6px));
            animation: spin 3.6s linear infinite;
            filter: drop-shadow(0 0 12px rgba(224, 57, 155, .6));
        }

        .orb-dash {
            position: absolute;
            inset: 16px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 138, 31, .38);
            animation: spin 12s linear infinite reverse;
        }

        .orb-halo {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, .10);
            animation: halo 2.6s ease-in-out infinite;
        }

        @keyframes halo {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(224, 57, 155, .40);
            }

            60% {
                box-shadow: 0 0 0 16px rgba(224, 57, 155, 0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .orb-core {
            position: absolute;
            inset: 26px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            background:
                radial-gradient(90% 90% at 50% 20%, rgba(224, 57, 155, .20), transparent 70%),
                rgba(16, 9, 32, .92);
            border: 1px solid rgba(255, 255, 255, .08);
            box-shadow: inset 0 0 40px rgba(255, 138, 31, .12);
        }

        .signal-label {
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 900;
            color: #ffd54a;
        }

        #coefficient {
            font-size: clamp(28px, 10vw, 44px);
            font-weight: 900;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 22px rgba(255, 138, 31, .65);
        }

        #coefficient.idle {
            font-size: clamp(13px, 4vw, 16px);
            color: rgba(243, 238, 252, .55);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .orb.pending .orb-ring {
            animation-duration: .8s;
        }

        .time-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            border-radius: 50px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .12);
            backdrop-filter: blur(8px);
            font-size: 12px;
            letter-spacing: 1.5px;
            font-weight: 800;
            color: rgba(243, 238, 252, .7);
        }

        .time-chip b {
            font-size: 17px;
            letter-spacing: 1px;
            color: var(--orange);
            font-variant-numeric: tabular-nums;
        }

        .time-chip.on {
            border-color: rgba(255, 138, 31, .5);
            box-shadow: 0 0 22px rgba(255, 138, 31, .2);
        }

        /* ====================== BAS DE PAGE ====================== */
        .footer {
            padding: 0 16px calc(16px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn {
            position: relative;
            width: 100%;
            max-width: 420px;
            border: 0;
            cursor: pointer;
            font-family: inherit;
            border-radius: 16px;
            padding: 17px 20px;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #fff;
            overflow: hidden;
            background: linear-gradient(135deg, var(--orange) 0%, var(--magenta) 55%, #7b2ff7 100%);
            box-shadow: 0 12px 30px rgba(224, 57, 155, .38), inset 0 1px 0 rgba(255, 255, 255, .28);
            transition: transform .14s ease, box-shadow .25s ease, filter .25s ease;
        }

        .btn span {
            position: relative;
            z-index: 2;
        }

        .btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, transparent 25%, rgba(255, 255, 255, .35) 50%, transparent 75%);
            transform: translateX(-130%);
            animation: sheen 3.2s ease-in-out infinite;
        }

        @keyframes sheen {

            0%,
            65% {
                transform: translateX(-130%);
            }

            100% {
                transform: translateX(130%);
            }
        }

        .btn:active {
            transform: translateY(2px) scale(.995);
            box-shadow: 0 6px 18px rgba(224, 57, 155, .3);
        }

        .btn[disabled] {
            cursor: not-allowed;
            filter: grayscale(.45) brightness(.7);
            box-shadow: none;
        }

        .btn[disabled]::after {
            display: none;
        }

        .btn-cool {
            position: absolute;
            left: 0;
            bottom: 0;
            height: 4px;
            width: 0%;
            background: linear-gradient(90deg, var(--orange), var(--violet));
            z-index: 3;
            transition: width .3s linear;
        }

        .btn-ghost {
            width: auto;
            padding: 9px 15px;
            font-size: 11px;
            letter-spacing: 1.5px;
            border-radius: 50px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .16);
            box-shadow: none;
            backdrop-filter: blur(8px);
            color: rgba(243, 238, 252, .85);
        }

        .btn-ghost::after {
            display: none;
        }

        .hint {
            font-size: 10.5px;
            letter-spacing: 1.5px;
            color: rgba(243, 238, 252, .42);
            text-align: center;
        }

        /* ====================== TOAST ====================== */
        .message-table {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translate(-50%, -140%);
            max-width: 90vw;
            padding: 12px 20px;
            border-radius: 0 0 16px 16px;
            background: rgba(24, 12, 46, .94);
            border: 1px solid rgba(255, 255, 255, .12);
            border-top: 0;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
            text-align: center;
            transition: transform .45s cubic-bezier(.2, .9, .3, 1.3);
            z-index: 1000;
        }

        .message-table.active {
            transform: translate(-50%, 0);
        }

        @media (max-height: 640px) {
            .wordmark.small {
                font-size: clamp(20px, 6vw, 28px);
            }

            .orb {
                width: min(50vw, 190px);
                height: min(50vw, 190px);
            }
        }
    </style>
</head>

<body>
    <!-- Ciel Lucky Jet : nuages qui défilent de droite vers la gauche -->
    <div class="bg-wrap">
        <div class="sky"></div>
        <div class="stars"></div>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
        <div class="cloud c4"></div>
        <div class="cloud c5"></div>
        <div class="cloud c6"></div>
        <div class="bg-mask"></div>
    </div>

    <div class="first-page" id="first-page">
        <div class="wordmark big"><span class="w1">Lucky</span><span class="w2">Jet</span></div>
        <div class="loader-container">
            <div class="loader-label">LOADING PREDICTOR...</div>
            <div class="loader-bar-track">
                <div class="loader-bar-fill" id="loader-bar-fill"></div>
            </div>
            <div class="loader-pct" id="loader-pct">1%</div>
        </div>
    </div>

    <div class="app" id="app">
        <div class="message-table" id="message-table"><span id="message-text"></span></div>

        <div class="topbar">
            <button class="btn btn-ghost" onclick="closePage()"><span>← Back</span></button>
            <span class="live"><i></i>LIVE</span>
        </div>

        <div class="stage">
            <div class="wordmark small"><span class="w1">Lucky</span><span class="w2">Jet</span></div>

            <div class="orb" id="orb">
                <div class="orb-halo"></div>
                <div class="orb-ring"></div>
                <div class="orb-dash"></div>
                <div class="orb-core">
                    <span class="signal-label">NEXT COEFFICIENT ✅</span>
                    <span id="coefficient" class="idle">EN ATTENTE</span>
                </div>
            </div>

            <div class="time-chip" id="time-chip">🕒 HEURE DE JEU <b id="play-time">--:--:--</b></div>
        </div>

        <div class="footer">
            <button class="btn" id="predict-btn" type="button">
                <span id="predict-label">NOUVELLE PRÉDICTION</span>
                <i class="btn-cool" id="btn-cool"></i>
            </button>
            <div class="hint" id="hint">APPUYEZ POUR OBTENIR VOTRE SIGNAL</div>
        </div>
    </div>

    <script src="../shared/protect.js"></script>
    <script src="../shared/predictor.js"></script>
    <script src="js/luckyJet.js"></script>

</body>

</html>
